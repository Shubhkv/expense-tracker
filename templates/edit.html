<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Expense</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f6fa; color: #333; }
        header { background: white; padding: 16px 32px; border-bottom: 1px solid #e8e8e8; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.3em; font-weight: 700; color: #1a1a2e; }
        .page { max-width: 500px; margin: 40px auto; padding: 0 20px; }
        .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
        .card h2 { font-size: 0.95em; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { font-size: 0.78em; color: #888; display: block; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 0.9em; background: #fafafa; transition: border 0.2s; }
        input:focus, select:focus { outline: none; border-color: #6c63ff; background: white; box-shadow: 0 0 0 3px rgba(108,99,255,0.1); }
        .btn-row { display: flex; gap: 10px; margin-top: 20px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.95em; font-weight: 600; text-align: center; text-decoration: none; display: block; }
        .btn-save { background: #6c63ff; color: white; }
        .btn-save:hover { background: #5a52d5; }
        .btn-cancel { background: #f1f3f4; color: #444; }
        .btn-cancel:hover { background: #e0e0e0; }
    </style>
</head>
<body>
<header>
    <h1>💰 Expense Tracker</h1>
</header>
<div class="page">
    <div class="card">
        <h2>Edit Expense</h2>
        <form method="POST">
            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    {% set cats = ['Food','Transport','Entertainment','Shopping','Bills','Other'] %}
                    {% for c in cats %}
                    <option {% if expense[2]==c %}selected{% endif %}>{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>Description</label>
                <input type="text" name="description" value="{{ expense[3] }}" required>
            </div>
            <div class="form-group">
                <label>Amount (₹)</label>
                <input type="number" name="amount" value="{{ expense[4] }}" step="0.01" min="0" required>
            </div>
            <div class="btn-row">
                <a href="/" class="btn btn-cancel">Cancel</a>
                <button class="btn btn-save" type="submit">Save Changes</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
